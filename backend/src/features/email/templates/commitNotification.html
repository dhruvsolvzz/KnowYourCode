<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>New Commit — KnowYourCode</title>
  </ head>

<body style="margin:0;padding:0;background:#0f0f13;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f13;padding:40px 20px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0"
          style="background:#1a1a2e;border-radius:16px;border:1px solid #2d2d4e;">
          <tr>
            <td style="background:linear-gradient(135deg,#6c63ff,#3ecfcf);padding:28px 36px;text-align:center;">
              <h1 style="margin:0;color:#fff;font-size:22px;font-weight:700;">📦 New Commit Detected</h1>
              <p style="margin:6px 0 0;color:rgba(255,255,255,0.9);font-size:14px;">{{repoName}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 36px;">
              <p style="margin:0 0 20px;color:#94a3b8;">Hey {{name}},</p>
              <div
                style="background:#12121f;border-radius:10px;padding:20px;border-left:4px solid #6c63ff;margin-bottom:20px;">
                <p style="margin:0 0 8px;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:1px;">
                  Commit {{sha}}</p>
                <p style="margin:0 0 12px;color:#e2e8f0;font-size:15px;font-weight:600;">{{message}}</p>
                <p style="margin:0;color:#64748b;font-size:13px;">by <strong style="color:#94a3b8;">{{author}}</strong>
                </p>
              </div>
              <div style="background:#12121f;border-radius:10px;padding:20px;margin-bottom:24px;">
                <p style="margin:0 0 8px;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:1px;">AI
                  Analysis</p>
                <p style="margin:0 0 12px;color:#e2e8f0;font-size:14px;line-height:1.6;">{{summary}}</p>
                <span
                  style="display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:{{impactLevel === 'high' ? '#ef4444' : impactLevel === 'medium' ? '#f97316' : '#22c55e'}};color:#fff;">{{impactLevel}}
                  impact</span>
              </div>
              <div style="text-align:center;">
                <a href="{{url}}"
                  style="display:inline-block;background:linear-gradient(135deg,#6c63ff,#3ecfcf);color:#fff;text-decoration:none;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:600;">View
                  on GitHub →</a>
              </div>
            </td>
          </tr>
          <tr>
            <td style="background:#12121f;padding:20px 36px;text-align:center;">
              <p style="margin:0;color:#475569;font-size:12px;">© 2024 KnowYourCode · <a href="{{dashboardUrl}}"
                  style="color:#6c63ff;text-decoration:none;">Dashboard</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
