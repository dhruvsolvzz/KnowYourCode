<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><title>Analysis Report — KnowYourCode</title></head>
<body style="margin:0;padding:0;background:#0f0f13;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f13;padding:40px 20px;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#1a1a2e;border-radius:16px;border:1px solid #2d2d4e;">
        <tr>
          <td style="background:linear-gradient(135deg,#3ecfcf,#6c63ff);padding:32px;text-align:center;">
            <h1 style="margin:0;color:#fff;font-size:24px;font-weight:700;">🔍 Analysis Complete</h1>
            <p style="margin:8px 0 0;color:rgba(255,255,255,0.9);">{{repoName}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 36px;">
            <p style="margin:0 0 24px;color:#94a3b8;">Hey {{name}}, your repository analysis is complete!</p>
            <div style="background:#12121f;border-radius:10px;padding:20px;margin-bottom:20px;">
              <p style="margin:0 0 8px;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:1px;">Detected Stack</p>
              <p style="margin:0;color:#e2e8f0;font-size:14px;">{{stack}}</p>
            </div>
            <div style="background:#12121f;border-radius:10px;padding:20px;margin-bottom:24px;">
              <p style="margin:0 0 8px;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:1px;">Files Analyzed</p>
              <p style="margin:0;color:#6c63ff;font-size:24px;font-weight:700;">{{totalFiles}}</p>
            </div>
            <div style="text-align:center;">
              <a href="{{dashboardUrl}}" style="display:inline-block;background:linear-gradient(135deg,#3ecfcf,#6c63ff);color:#fff;text-decoration:none;padding:13px 32px;border-radius:8px;font-size:14px;font-weight:600;">View Graph →</a>
            </div>
          </td>
        </tr>
        <tr><td style="background:#12121f;padding:20px;text-align:center;">
          <p style="margin:0;color:#475569;font-size:12px;">© 2024 KnowYourCode</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
